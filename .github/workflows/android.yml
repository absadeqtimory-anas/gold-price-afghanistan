
name: Build Gold Price APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldPriceAfghanistan_Android_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o GoldPriceAfghanistan_Android_Project.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p GoldPriceAfghanistan assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Price-Afghanistan-APK
          path: GoldPriceAfghanistan/app/build/outputs/apk/debug/app-debug.apk
